name: Frontend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-lint:
    name: Lint & Build React Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Ambil kode dari repositori
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instal dependensi frontend
        run: npm ci

      - name: Jalankan ESLint (Cek kualitas kode)
        run: npm run lint

      - name: Uji Build Produksi Vite
        run: npm run build