name: Backend CI (Python & FastAPI)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode dari repositori
        uses: actions/checkout@v4

      - name: Pilih bahasa Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instal library backend dan tools testing
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx flake8

      - name: Cek error sintaks dan variabel tidak dikenal (Linter)
        run: |
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Jalankan unit test FastAPI & Model ML
        working-directory: backend
        run: |
          pytest